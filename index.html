<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a1b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Alvorada — RPG de Mundo Aberto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-input="keyboard">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="vignette"></div>

  <div id="hud">
    <div id="place">…</div>
    <div id="coords"></div>
  </div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>

  <div id="touch-ui">
    <div id="joy-zone"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>
    <button id="btn-run" type="button">CORRER</button>
  </div>

  <div id="fade"></div>
  <div id="loading"><span>Carregando…</span></div>

  <script src="js/textures.js"></script>
  <script src="js/player.js"></script>
  <script src="js/map.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
